name: Bug report
description: Something in Refreshify doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, follow the [security policy](https://github.com/lukastojiljkovic/Refreshify/security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Cleanup
        2. Run Windows temporary files
        3. ...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Get help report
      description: If a step failed, select Get help on it, keep "Hide personal details" on, copy the report and paste it here.
      render: markdown
  - type: input
    id: refreshify-version
    attributes:
      label: Refreshify version
      description: Settings > About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Home > Windows
      placeholder: Windows 11 Pro, version 25H2, build 26200
    validations:
      required: true
