name: Feature or tool request
description: Suggest a new tool or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What would you like Refreshify to fix or do, and when do you run into it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: For a new tool, which Windows tool or command does it run, and does it need administrator rights?
    validations:
      required: true
